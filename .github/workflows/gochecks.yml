# copied from fortio/workflows
name: go-checks

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Run Vulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Download linter config
        if: matrix.os == 'ubuntu-latest'
        run: curl -fsS -o .golangci.yml https://raw.githubusercontent.com/fortio/workflows/main/golangci.yml
      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # pin@v8
        with:
          version: v2.15.0
      - name: Run tests
        run: |
          go version
          go run . buildinfo || true # to also confirm go toolchain version used
          if make -n test &>/dev/null; then
            echo "Running tests with make test"
            make test
          else
            echo "No Makefile test target, running tests with race detection as default behavior"
            go test -race ./...
          fi
        shell: bash # to use bash on Windows
