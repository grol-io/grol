version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      exclude:
        - "fortio.org/*" # our own releases: pick up immediately
    groups:
      "fortio":
        patterns:
          - "fortio.org/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
